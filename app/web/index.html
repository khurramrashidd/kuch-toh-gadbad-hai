<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kuch Toh Gadbad Hai - an Earth System Trend Detective. NASA satellite data, honest statistics: what is changing, where, how much, and is it significant? NASA Space Apps Challenge 2026.">
  <meta name="theme-color" content="#F5F6FA">
  <meta property="og:title" content="Kuch Toh Gadbad Hai - Earth System Trend Detective">
  <meta property="og:description" content="Same cause, opposite trends. 40 years of NASA data for any place on Earth.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kuch Toh Gadbad Hai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Kuch Toh Gadbad Hai · Earth Trend Detective</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F5F6FA; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #9A3412; gap: 14px; }
    #splash img { width: 96px; height: 96px; animation: pulse 1.4s ease-in-out infinite; }
    #splash small { color: #5F6B7E; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div><b>Kuch Toh Gadbad Hai</b></div>
    <small>Opening the case files… · केस फ़ाइलें खुल रही हैं…</small>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash'); if (s) s.remove();
    });
  </script>
  <!-- Opening video (assets/intro/intro.mp4). If the file is missing or slow, this removes itself. -->
  <div id="intro" style="position:fixed;inset:0;background:#000;z-index:20;display:none">
    <video id="introVideo" playsinline muted preload="auto" style="width:100%;height:100%;object-fit:contain"></video>
    <button id="introSkip" style="position:absolute;top:14px;right:14px;padding:9px 16px;border:0;border-radius:20px;background:#ffffffdd;font-weight:700;cursor:pointer">Skip</button>
    <button id="introSound" style="position:absolute;top:14px;right:92px;padding:9px 16px;border:0;border-radius:20px;background:#ffffffdd;font-weight:700;cursor:pointer">Sound on</button>
    <div style="position:absolute;left:14px;bottom:10px;color:#ffffffb3;font:12px sans-serif">AI-generated video (Google Gemini)</div>
  </div>
  <style>
    #intro { transition: opacity 1.1s ease, transform 1.1s ease; }
    #intro.leaving { opacity: 0; transform: scale(1.25); pointer-events: none; }   /* the video flies past the viewer */
    @keyframes ktghArrive { from { opacity: 0; transform: scale(0.82); } to { opacity: 1; transform: scale(1); } }
    .ktgh-arrive { animation: ktghArrive 1.2s cubic-bezier(.2,.7,.2,1) both; transform-origin: 50% 45%; }
  </style>
  <script>
    (function () {
      var box = document.getElementById('intro'), v = document.getElementById('introVideo'), soundBtn = document.getElementById('introSound');
      var done = false, started = false;
      function soundOn() { v.muted = false; if (soundBtn) { soundBtn.remove(); soundBtn = null; } }
      function firstTouch() { if (!done && started) soundOn(); }
      ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) { window.addEventListener(ev, firstTouch, { once: true, capture: true }); });
      function end(quick) {
        if (done) return; done = true;
        if (!started || quick === true) { try { v.pause(); } catch (e) {} box.remove(); return; }
        // the app arrives from far away while the video fades and its sound dips
        var app = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane');
        if (app) { app.classList.add('ktgh-arrive'); setTimeout(function () { app.classList.remove('ktgh-arrive'); }, 1400); }
        box.classList.add('leaving');
        var fade = setInterval(function () { try { v.volume = Math.max(0, v.volume - 0.1); } catch (e) {} }, 100);
        setTimeout(function () { clearInterval(fade); try { v.pause(); } catch (e) {} box.remove(); }, 1150);
      }
      var upright = window.innerHeight > window.innerWidth;
      var files = upright ? ['intro_portrait.mp4', 'intro.mp4'] : ['intro.mp4', 'intro_portrait.mp4'], at = 0;
      v.addEventListener('error', function () { at++; if (at < files.length) v.src = 'assets/assets/intro/' + files[at]; else end(true); });
      v.addEventListener('ended', function () { end(); });
      v.addEventListener('canplay', function () {
        if (done || started) return;
        started = true;
        box.style.display = 'block';
        // 1) try with sound; 2) browsers that block it get a silent start, and sound comes on at the first click, tap or key
        v.muted = false;
        var p = v.play();
        if (p && p.then) {
          p.then(function () { if (soundBtn) { soundBtn.remove(); soundBtn = null; } }).catch(function () {
            v.muted = true;
            var q = v.play(); if (q && q.catch) q.catch(function () { end(true); });
          });
        }
      });
      document.getElementById('introSkip').onclick = function (e) { e.stopPropagation(); end(); };
      if (soundBtn) soundBtn.onclick = soundOn;
      v.src = 'assets/assets/intro/' + files[0];
      setTimeout(function () { if (!started) end(true); }, 5000);   // slow network: do not hold the visitor
      setTimeout(function () { end(); }, 20000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
