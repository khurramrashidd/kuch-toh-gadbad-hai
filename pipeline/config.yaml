# Kuch Toh Gadbad Hai - pipeline settings
# Paths are relative to this pipeline/ folder.

output_dir: ../app/web/data   # the app reads from here; Firebase Hosting serves it at /data/
cache_dir: .cache             # downloads + intermediate results (safe to delete)

analysis:
  baseline: [1991, 2020]      # anomalies are relative to this WMO normal period
  min_years: 15               # fewer valid years than this -> "Not enough data"
  min_valid_frac: 0.8         # share of years in the period that must have data
  alpha: 0.05                 # significance level for single time series
  fdr_alpha: 0.10             # map-wide FDR level (Wilks 2016: alpha_FDR = 2 x 0.05)
  grid_method: lag1           # autocorrelation correction on maps: lag1 | hamed_rao | none
  series_method: lag1         # same for single series (lag1 had the best false-alarm rate in our selftest)
  snr_confirm: 1.0            # change over the record must exceed 1x year-to-year noise to be "Confirmed"

mirror:
  min_cells: 4                # smallest significant cluster that can be a mirror region
  max_clusters: 8             # strongest clusters per sign considered for pairing
  driver_p: 0.10              # fingerprint regression must reach this p-value
  explained_min: 0.25         # driver must explain at least this share of the trend

drivers_default: [gistemp_global, nino34]   # global suspects tested for every case

publish:
  series_block: 16            # map cells per side in each time-series chunk file
  png_scale: 4                # pixels per map cell in trend images

app:
  # Gemini models tried in order by the in-app AI narrator (Firebase AI Logic, free tier)
  ai_models: [gemini-3.5-flash-lite, gemini-flash-lite-latest, gemini-2.5-flash-lite]
