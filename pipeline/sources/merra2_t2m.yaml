# NASA MERRA-2 monthly 2 m air temperature (named in the challenge statement). Streamed: only T2M is read.
id: merra2_t2m
title: Air temperature near the ground (NASA MERRA-2)
title_hi: ज़मीन के पास हवा का तापमान (NASA MERRA-2)
short: Air temperature (MERRA-2)
short_hi: हवा का तापमान (MERRA-2)
sphere: atmosphere
mission: NASA GMAO MERRA-2 reanalysis (M2TMNXSLV, monthly mean)
kind: grid
role: layer
access:
  method: earthaccess
  short_name: M2TMNXSLV
  version: "5.12.4"
  mode: stream
  subset: {variables: [T2M], coarsen: 2}
read:
  variable: T2M
convert: K_to_C
units: °C
