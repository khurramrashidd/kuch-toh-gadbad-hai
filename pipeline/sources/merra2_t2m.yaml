explain: "Air temperature 2 m above the ground from NASA's weather-history model, which blends satellite and ground data."
explain_hi: "ज़मीन से 2 मीटर ऊपर हवा का तापमान, NASA के मौसम-इतिहास मॉडल से, जो उपग्रह और ज़मीनी डेटा मिलाता है।"
citation: >-
  Global Modeling and Assimilation Office (GMAO), 2015: MERRA-2 tavgM_2d_slv_Nx: 2d, Monthly mean, Single-Level,
  Assimilation, Single-Level Diagnostics V5.12.4. NASA GES DISC. https://doi.org/10.5067/AP1B0BA5PD2K ;
  Gelaro, R. et al., 2017, J. Climate 30, 5419-5454.
url_info: https://disc.gsfc.nasa.gov/datasets/M2TMNXSLV_5.12.4/summary
