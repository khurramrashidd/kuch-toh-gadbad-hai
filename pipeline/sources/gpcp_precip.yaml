# GPCP v2.3 monthly precipitation (NASA GSFC product, NOAA PSL copy - no login)
id: gpcp_precip
title: Rainfall (GPCP v2.3, satellite + gauges)
title_hi: बारिश (GPCP v2.3, उपग्रह + वर्षामापी)
short: Rainfall
short_hi: बारिश
gender_hi: f
sphere: hydrosphere
mission: Global Precipitation Climatology Project v2.3 (NASA GSFC; SSM/I, TRMM/GPM-era satellites + rain gauges)
kind: grid
role: layer
access:
  method: http
  url: https://downloads.psl.noaa.gov/Datasets/gpcp/precip.mon.mean.nc
read:
  variable: precip
  percent_min_base: 0.3        # skip % trends where it barely rains (deserts)
units: mm/day
trend_units: percent           # rainfall trends read best as % of normal per decade
period: {start: 1979, end: auto}
seasons: [ANN, JJAS, DJF, MAM, SON]
min_coverage: 0.75
palette: precip
citation: >-
  Adler, R.F. et al., 2018: The Global Precipitation Climatology Project (GPCP) monthly analysis
  (new version 2.3) and a review of 2017 global precipitation. Atmosphere, 9(4), 138. Data via NOAA PSL,
  https://psl.noaa.gov/data/gridded/data.gpcp.html
url_info: https://psl.noaa.gov/data/gridded/data.gpcp.html
explain: "Rain and snow over land and sea, blended from satellites and rain gauges since 1979."
explain_hi: "ज़मीन और समुद्र पर बारिश-बर्फ़, 1979 से उपग्रह और वर्षामापी मिलाकर।"
